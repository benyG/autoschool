[server]
# Écoute sur toutes les interfaces réseau, pas seulement 127.0.0.1 :
# l'app devient accessible depuis les autres appareils du même Wi-Fi
# (téléphone, tablette) via l'IP locale de cette machine, sans avoir
# à repasser --server.address à chaque lancement.
address = "0.0.0.0"
port = 8501

# headless=false : Streamlit affiche l'IP locale réelle à saisir sur un
# autre appareil ("Network URL"). En headless, seule l'adresse d'écoute
# 0.0.0.0 est affichée — inutilisable telle quelle sur un téléphone.
headless = false

[browser]
# N'affiche que l'adresse pertinente pour un usage sur réseau local.
gatherUsageStats = false
